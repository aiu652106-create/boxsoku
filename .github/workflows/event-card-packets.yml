name: Collect official fight cards for writing
on:
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-event-card-packets
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect once and prepare evidence packets
        run: node scripts/collect-event-cards.mjs --output-dir event-card-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-writing-packets
          path: event-card-output/
          retention-days: 7
